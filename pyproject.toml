[project]
name = "dynasty-draft-2026"
version = "0.1.0"
description = "Draft pool, live board, and VOR rankings for a 12-team superflex dynasty league"
readme = "README.md"
requires-python = ">=3.12"

# Nearly stdlib: the html parse uses html.parser and both fetches use urllib.request.
# numpy exists only to keep the ranker's market repricing inside the live-draft window.
dependencies = [
    "numpy>=2.5.2",
]

[tool.uv]
# A folder of scripts, not an importable package — there is nothing to build or
# install, and each pipeline is run by path (`uv run pool_pipeline/pipeline.py`).
package = false
